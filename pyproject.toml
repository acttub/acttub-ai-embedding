[project]
name = "video-feedback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ryujisung", email = "101336693+ryujisung@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "av>=17.1.0",
    "google-genai>=2.9.0",
    "gradio>=6.19.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.12.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: GPU/모델 다운로드가 필요한 테스트"]
